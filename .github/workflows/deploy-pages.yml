name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # site/build.py reads each published file's last commit date with
        # `git log -1` to fill sitemap <lastmod>, so the history must be
        # present. A shallow checkout would silently fall back to file mtime,
        # which on a fresh runner is the checkout time — every page would
        # claim it changed today, on every deploy.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        # Pinned, and scoped to this job only. The test surface stays
        # stdlib-only: build.py imports markdown lazily so site/test_build.py
        # runs without it.
        run: python3 -m pip install --disable-pip-version-check 'markdown==3.7'

      - name: Configure Pages
        # Runs before the build so the canonical URLs, sitemap and robots.txt
        # are written against the real deployment origin rather than a
        # hardcoded guess.
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          # A Search Console verification token is public by design — it ships
          # in the page source — so a repository variable is the right home
          # for it. Unset is fine; the meta tag is simply omitted.
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: |
          python3 site/build.py \
            --out _site \
            --base-url "${{ steps.pages.outputs.base_url }}" \
            --repo-url "${{ github.server_url }}/${{ github.repository }}"

      - name: Verify crawler contract
        # Checks the built artifact, not the generator (site/test_build.py
        # covers that). Fails the deploy rather than shipping a site Google
        # cannot read: a sitemap URL with no page behind it, a noindex page
        # listed for indexing, or a page missing its title, description or
        # canonical.
        run: |
          python3 site/verify.py \
            --out _site \
            --base-url "${{ steps.pages.outputs.base_url }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
